services:
  web:
    image: kyzerowen/library_space:latest
    ports:
      - "8000:80"
    depends_on:
      - db

  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes" 
      MYSQL_DATABASE: library_db        
    volumes:
      - ./library_system.sql:/docker-entrypoint-initdb.d/library_system.sql
      - db_data:/var/lib/mysql

volumes:
  db_data: